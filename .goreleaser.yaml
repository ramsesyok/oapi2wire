version: 2

project_name: oapi2wire

before:
  hooks:
    - go run scripts/licenses.go

builds:
  - id: oapi2wire
    main: .
    binary: oapi2wire
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ramsesyok/oapi2wire/cmd.Version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Dependencies
      regexp: '^.*Bump .*$'
      order: 1
    - title: Changes
      order: 0

release:
  header: |
    ## インストール

    下記のアーカイブから OS / アーキテクチャに合ったもの（Windows は `oapi2wire_{{ .Tag }}_windows_amd64.zip`）をダウンロードし、
    展開した `oapi2wire` を PATH の通った場所に置いてください。

    ```sh
    go install github.com/ramsesyok/oapi2wire@{{ .Tag }}
    ```
